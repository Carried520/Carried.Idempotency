name: Publish NuGet Packages

on:
  release:
    types: [released]

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Get package version
        id: version
        shell: bash
        run: echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack Core
        run: >
          dotnet pack src/Carried.Idempotency/Carried.Idempotency.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Dependency Injection
        run: >
          dotnet pack src/Carried.Idempotency.DependencyInjection/Carried.Idempotency.DependencyInjection.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack ASP.NET Core
        run: >
          dotnet pack src/Carried.Idempotency.AspNet/Carried.Idempotency.AspNet.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Redis
        run: >
          dotnet pack src/Carried.Idempotency.Redis/Carried.Idempotency.Redis.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Carried

      - name: Publish to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate